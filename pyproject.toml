[project]
name = "CFSCAN-SNI"
version = "1.3.0"
description = "Local Cloudflare region optimizer with Lite calibration and verified Git publishing"
requires-python = ">=3.10"
dependencies = ["aiohttp>=3.12,<4", "Babel>=2.14,<3"]

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
